name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            DIFF_BASE="${{ github.event.before }}"
            if [ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD^"
            fi
          fi
          
          # 소스, 테스트, 빌드 설정, CI 설정 파일 변경 여부 확인
          if git diff --name-only $DIFF_BASE HEAD | grep -E "src/main/|src/test/|src/androidTest/|build-logic/|build.gradle.kts|gradle/|gradle.properties|.github/workflows/build.yml" > /dev/null; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Gradle Wrapper
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        if: steps.filter.outputs.code_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test with JaCoCo
        if: steps.filter.outputs.code_changed == 'true'
        env:
          CLIENT_ID: githubsearch-ci-placeholder
          CLIENT_SECRET: githubsearch-ci-placeholder
          REDIRECT_URI: githubsearch://ci
        run: ./gradlew spotlessCheck lintDebug assembleDebug assembleDebugAndroidTest testDebugUnitTest jacocoFullReport --parallel --build-cache --configure-on-demand

      - name: Upload JaCoCo Report
        if: steps.filter.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoFullReport
          if-no-files-found: error

      - name: Prepare Deployment Directory
        if: github.ref == 'refs/heads/develop' && steps.filter.outputs.code_changed == 'true'
        run: |
          mkdir -p build/dist/badges
          touch build/dist/.nojekyll
          
          # HTML 리포트 복사
          if [ -d "build/reports/jacoco/jacocoFullReport/html" ]; then
            cp -r build/reports/jacoco/jacocoFullReport/html/* build/dist/
          fi
          
          REPORT_PATH="build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml"
          
          # Python을 사용한 안정적인 XML 파싱 및 배지 생성 (에러 핸들링 강화)
          python3 - <<EOF
          import xml.etree.ElementTree as ET
          import json
          import os

          def analyze_coverage(xml_path):
              print(f"--- Analyzing {xml_path} ---")
              if not os.path.exists(xml_path):
                  print(f"Error: {xml_path} does not exist")
                  return None
              
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  
                  stats = {
                      "vm": {"m": 0, "c": 0},
                      "uc": {"m": 0, "c": 0},
                      "repo": {"m": 0, "c": 0}
                  }

                  for pkg in root.findall('package'):
                      pkg_name = pkg.get('name', '').replace('.', '/')
                      
                      # 1. ViewModel (feature 패키지 내 ViewModel 키워드 포함 클래스)
                      if "feature" in pkg_name:
                          for cls in pkg.findall('class'):
                              cls_name = cls.get('name', '')
                              if "ViewModel" in cls_name and "Test" not in cls_name:
                                  for cnt in cls.findall('counter'):
                                      if cnt.get('type') == 'INSTRUCTION':
                                          stats["vm"]["m"] += int(cnt.get('missed', 0))
                                          stats["vm"]["c"] += int(cnt.get('covered', 0))
                      
                      # 2. UseCase & Domain Model (domain 패키지)
                      elif "domain" in pkg_name:
                          if any(k in pkg_name for k in ["usecase", "model"]):
                              for cnt in pkg.findall('counter'):
                                  if cnt.get('type') == 'INSTRUCTION':
                                      stats["uc"]["m"] += int(cnt.get('missed', 0))
                                      stats["uc"]["c"] += int(cnt.get('covered', 0))
                      
                      # 3. Repository (data 패키지 내 repository 키워드 포함)
                      elif "data" in pkg_name:
                          # 배지 이름에 걸맞게 순수 'repository' 로직만 집계
                          if "repository" in pkg_name:
                              for cnt in pkg.findall('counter'):
                                  if cnt.get('type') == 'INSTRUCTION':
                                      stats["repo"]["m"] += int(cnt.get('missed', 0))
                                      stats["repo"]["c"] += int(cnt.get('covered', 0))
                  
                  return stats
              except Exception as e:
                  print(f"Critical Parsing Error: {e}")
                  return None

          def create_badge(label, value, filename):
              color = "brightgreen" if value >= 80 else "green" if value >= 60 else "orange" if value >= 40 else "red"
              data = {
                  "schemaVersion": 1,
                  "label": label,
                  "message": f"{value}%",
                  "color": color
              }
              output_path = f"build/dist/badges/{filename}-coverage.json"
              with open(output_path, "w") as f:
                  json.dump(data, f)
              print(f"Created Badge: {output_path} ({label}: {value}%)")

          stats = analyze_coverage("$REPORT_PATH")
          if stats:
              def calc(key):
                  total = stats[key]["m"] + stats[key]["c"]
                  return int(stats[key]["c"] * 100 / total) if total > 0 else 0

              vm_v = calc("vm")
              uc_v = calc("uc")
              repo_v = calc("repo")
              
              total_m = stats["vm"]["m"] + stats["uc"]["m"] + stats["repo"]["m"]
              total_c = stats["vm"]["c"] + stats["uc"]["c"] + stats["repo"]["c"]
              tot_v = int(total_c * 100 / (total_m + total_c)) if (total_m + total_c) > 0 else 0

              create_badge("ViewModel", vm_v, "viewmodel")
              create_badge("UseCase", uc_v, "usecase")
              create_badge("Repository", repo_v, "repository")
              create_badge("Unit Test", tot_v, "unit-test")
          EOF

      - name: Verify Artifacts
        if: github.ref == 'refs/heads/develop' && steps.filter.outputs.code_changed == 'true'
        run: |
          echo "--- Checking Generated Badges ---"
          ls -R build/dist/badges/
          echo "--------------------------------"

      - name: Upload Coverage Pages Package
        if: github.ref == 'refs/heads/develop' && steps.filter.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pages
          path: build/dist
          if-no-files-found: error

  coverage-comment:
    name: "JaCoCo PR Comment"
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.code_changed == 'true' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Download JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoFullReport

      - name: Post JaCoCo Report Comment
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "📈 테스트 커버리지 리포트"
          update-comment: true

  deploy-pages:
    name: "Deploy Coverage Pages"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.build.outputs.code_changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Coverage Pages Package
        uses: actions/download-artifact@v4
        with:
          name: coverage-pages
          path: build/dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
