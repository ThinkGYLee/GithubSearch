name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [ main, develop ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 변경 사항 확인을 위해 전체 히스토리 가져오기

      - name: Check for Test Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            DIFF_BASE="${{ github.event.before }}"
            # 첫 푸시거나 이전 커밋 정보를 알 수 없는 경우 대비
            if [ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD^"
            fi
          fi
          
          # 테스트 관련 파일 변경 여부 확인
          if git diff --name-only $DIFF_BASE HEAD | grep -E "src/test/|src/androidTest/" > /dev/null; then
            echo "tests_changed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Check and Build and Test with Coverage
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        # 테스트 코드가 변경되었을 때만 jacocoFullReport 실행, 아니면 일반 테스트만 실행
        run: |
          if [ "${{ steps.filter.outputs.tests_changed }}" == "true" ]; then
            ./gradlew spotlessCheck assembleDebug testDebugUnitTest jacocoFullReport --parallel --build-cache --configure-on-demand
          else
            ./gradlew spotlessCheck assembleDebug testDebugUnitTest --parallel --build-cache --configure-on-demand
          fi

      - name: Post JaCoCo Report Comment
        if: github.event_name == 'pull_request' && steps.filter.outputs.tests_changed == 'true'
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "📈 테스트 커버리지 리포트"
          update-comment: true

      - name: Prepare Deployment Directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.tests_changed == 'true'
        run: |
          mkdir -p build/dist/badges
          cp -r build/reports/jacoco/jacocoFullReport/html/* build/dist/
          
          # JSON 배지 데이터 생성 로직
          REPORT_PATH="build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml"
          
          extract_coverage() {
            local package=$1
            if [ -z "$package" ]; then
              missed=$(grep -oPm1 '(?<=</package><counter type="INSTRUCTION" missed=")[0-9]+' "$REPORT_PATH" || echo 0)
              covered=$(grep -oPm1 '(?<=</package><counter type="INSTRUCTION" missed="'$missed'" covered=")[0-9]+' "$REPORT_PATH" || echo 0)
            else
              line=$(grep "package name=\"$package\"" "$REPORT_PATH" -A 10 | grep "counter type=\"INSTRUCTION\"" | head -n 1)
              missed=$(echo "$line" | grep -oP '(?<=missed=")[0-9]+' || echo 0)
              covered=$(echo "$line" | grep -oP '(?<=covered=")[0-9]+' || echo 0)
            fi
            total=$((missed + covered))
            if [ "$total" -eq 0 ]; then echo 0; else echo $((covered * 100 / total)); fi
          }

          get_color() {
            if [ "$1" -ge 80 ]; then echo "brightgreen"; elif [ "$1" -ge 60 ]; then echo "green"; elif [ "$1" -ge 40 ]; then echo "orange"; else echo "red"; fi
          }

          create_badge_json() {
            local label=$1
            local value=$2
            local color=$(get_color $value)
            echo "{\"schemaVersion\": 1, \"label\": \"$label\", \"message\": \"$value%\", \"color\": \"$color\"}" > "build/dist/badges/$3-coverage.json"
          }

          DOMAIN_COV=$(extract_coverage "com/gyleedev/domain")
          DATA_COV=$(extract_coverage "com/gyleedev/data")
          TOTAL_COV=$(extract_coverage "")

          create_badge_json "Domain" $DOMAIN_COV "domain"
          create_badge_json "Data" $DATA_COV "data"
          create_badge_json "Total" $TOTAL_COV "total"

      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.tests_changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dist
          force_orphan: true # gh-pages 브랜치가 없으면 자동으로 생성함
