name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            DIFF_BASE="${{ github.event.before }}"
            if [ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD^"
            fi
          fi
          
          if git diff --name-only $DIFF_BASE HEAD | grep -E "src/main/|src/test/|src/androidTest/|build-logic/|build.gradle.kts|gradle/" > /dev/null; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Gradle Wrapper
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        if: steps.filter.outputs.code_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build and Test with JaCoCo
        if: steps.filter.outputs.code_changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: ./gradlew spotlessCheck assembleDebug testDebugUnitTest jacocoFullReport --parallel --build-cache --configure-on-demand

      - name: Post JaCoCo Report Comment
        if: github.event_name == 'pull_request' && steps.filter.outputs.code_changed == 'true'
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "📈 테스트 커버리지 리포트"
          update-comment: true

      - name: Prepare Deployment Directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        run: |
          mkdir -p build/dist/badges
          touch build/dist/.nojekyll
          
          # HTML 리포트 복사
          cp -r build/reports/jacoco/jacocoFullReport/html/* build/dist/
          
          REPORT_PATH="build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml"
          
          # Python을 사용한 안정적인 XML 파싱 및 배지 생성
          python3 - <<EOF
          import xml.etree.ElementTree as ET
          import json
          import os

          def get_coverage(xml_path, package_prefix=None):
              try:
                  if not os.path.exists(xml_path):
                      print(f"Warning: {xml_path} not found")
                      return 0
                  
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  missed, covered = 0, 0
                  
                  if package_prefix:
                      found_any = False
                      for pkg in root.findall('package'):
                          pkg_name = pkg.get('name', '')
                          if pkg_name.startswith(package_prefix):
                              found_any = True
                              for cnt in pkg.findall('counter'):
                                  if cnt.get('type') == 'INSTRUCTION':
                                      missed += int(cnt.get('missed', 0))
                                      covered += int(cnt.get('covered', 0))
                      if not found_any:
                          print(f"Warning: No packages found with prefix {package_prefix}")
                  else:
                      for cnt in root.findall('counter'):
                          if cnt.get('type') == 'INSTRUCTION':
                              missed += int(cnt.get('missed', 0))
                              covered += int(cnt.get('covered', 0))
                  
                  total = missed + covered
                  percentage = int(covered * 100 / total) if total > 0 else 0
                  print(f"Coverage for {package_prefix or 'Total'}: {percentage}% ({covered}/{total})")
                  return percentage
              except Exception as e:
                  print(f"Error parsing coverage: {e}")
                  return 0

          def create_badge(label, value, filename):
              color = "brightgreen" if value >= 80 else "green" if value >= 60 else "orange" if value >= 40 else "red"
              data = {"schemaVersion": 1, "label": label, "message": f"{value}%", "color": color}
              file_path = f"build/dist/badges/{filename}-coverage.json"
              with open(file_path, "w") as f:
                  json.dump(data, f)
              print(f"Created badge: {file_path}")

          # 수치 계산 및 배지 생성
          dom_cov = get_coverage("$REPORT_PATH", "com/gyleedev/githubsearch/domain")
          dat_cov = get_coverage("$REPORT_PATH", "com/gyleedev/data")
          tot_cov = get_coverage("$REPORT_PATH")

          create_badge("Domain", dom_cov, "domain")
          create_badge("Data", dat_cov, "data")
          create_badge("Total", tot_cov, "total")
          EOF

      - name: Verify Deployment Directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        run: |
          echo "--- Deployment Directory Structure ---"
          find build/dist -maxdepth 2
          echo "-------------------------------------"

      - name: Upload Pages Artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
