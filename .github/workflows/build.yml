name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      pages: write      # Pages 배포를 위한 필수 권한
      id-token: write   # OIDC 배포를 위한 필수 권한

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            DIFF_BASE="${{ github.event.before }}"
            if [ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD^"
            fi
          fi
          
          if git diff --name-only $DIFF_BASE HEAD | grep -E "src/main/|src/test/|src/androidTest/|build-logic/|build.gradle.kts|gradle/" > /dev/null; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Gradle Wrapper
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        if: steps.filter.outputs.code_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        if: steps.filter.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build and Test with JaCoCo
        if: steps.filter.outputs.code_changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: ./gradlew spotlessCheck assembleDebug testDebugUnitTest jacocoFullReport --parallel --build-cache --configure-on-demand

      - name: Post JaCoCo Report Comment
        if: github.event_name == 'pull_request' && steps.filter.outputs.code_changed == 'true'
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "📈 테스트 커버리지 리포트"
          update-comment: true

      - name: Prepare Deployment Directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        run: |
          mkdir -p build/dist/badges
          cp -r build/reports/jacoco/jacocoFullReport/html/* build/dist/
          
          REPORT_PATH="build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml"
          
          # 정교해진 수치 추출 함수 (정규표현식 기반)
          extract_coverage() {
            local search_pattern=$1
            local line=$(grep -Pzo "$search_pattern.*?(?=<counter type=\"LINE\")" "$REPORT_PATH" | tr -d '\0' | grep "counter type=\"INSTRUCTION\"" | tail -n 1)
            
            if [ -z "$line" ]; then
              echo 0
            else
              missed=$(echo "$line" | grep -oP 'missed="\K[0-9]+')
              covered=$(echo "$line" | grep -oP 'covered="\K[0-9]+')
              total=$((missed + covered))
              if [ "$total" -eq 0 ]; then echo 0; else echo $((covered * 100 / total)); fi
            fi
          }

          # 레이어별 패키지 경로에 맞춰 추출
          DOMAIN_COV=$(extract_coverage "package name=\"com/gyleedev/githubsearch/domain")
          DATA_COV=$(extract_coverage "package name=\"com/gyleedev/data")
          TOTAL_COV=$(tail -n 10 "$REPORT_PATH" | grep "counter type=\"INSTRUCTION\"" | head -n 1 | grep -oP 'covered="\K[0-9]+' | xargs -I {} sh -c "c={}; m=\$(tail -n 10 \"$REPORT_PATH\" | grep \"counter type=\\\"INSTRUCTION\\\"\" | head -n 1 | grep -oP 'missed=\"\K[0-9]+'); echo \$((\$c * 100 / (\$m + \$c)))")

          get_color() {
            if [ "$1" -ge 80 ]; then echo "brightgreen"; elif [ "$1" -ge 60 ]; then echo "green"; elif [ "$1" -ge 40 ]; then echo "orange"; else echo "red"; fi
          }

          create_badge_json() {
            local label=$1
            local value=$2
            local color=$(get_color $value)
            echo "{\"schemaVersion\": 1, \"label\": \"$label\", \"message\": \"$value%\", \"color\": \"$color\"}" > "build/dist/badges/$3-coverage.json"
          }

          create_badge_json "Domain" $DOMAIN_COV "domain"
          create_badge_json "Data" $DATA_COV "data"
          create_badge_json "Total" $TOTAL_COV "total"

      - name: Upload Pages Artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.filter.outputs.code_changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
